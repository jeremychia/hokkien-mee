name: Update Hokkien Mee Map

on:
  schedule:
    # Run daily at 06:00 UTC (14:00 SGT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python + uv ─────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # ── Playwright browser ──────────────────────────────────
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # ── Secrets ─────────────────────────────────────────────
      - name: Write Facebook cookies
        run: echo "${{ secrets.FACEBOOK_COOKIES }}" > facebook_cookies.txt

      - name: Write OneMap secrets
        run: |
          mkdir -p secrets
          cat > secrets/secrets.py << 'PYEOF'
          onemap = {
              "email": "${{ secrets.ONEMAP_EMAIL }}",
              "password": "${{ secrets.ONEMAP_PASSWORD }}",
          }
          PYEOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' secrets/secrets.py

      # ── Geocode cache (speeds up reruns) ────────────────────
      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: output/geocode_cache.json
          key: geocode-cache-${{ hashFiles('output/geocode_cache.json') }}
          restore-keys: geocode-cache-

      # ── Image cache (avoid re-downloading) ────────────────
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: |
            output/images
            docs/images
          key: image-cache-${{ github.run_id }}
          restore-keys: image-cache-

      # ── Run pipeline ────────────────────────────────────────
      - name: Scrape Facebook group
        run: uv run python extractor/extract_group.py --pages 10
        env:
          # Playwright runs headless by default in CI
          CI: true

      - name: Download images
        run: uv run python extractor/download_images.py

      - name: Generate map
        run: uv run python extractor/map_posts.py

      # ── Commit & push ──────────────────────────────────────
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/group_posts.json docs/index.html docs/images output/geocode_cache.json
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily map update $(date -u +%Y-%m-%d)"
            # Pull with rebase in case remote has new commits, then push
            git pull --rebase origin main
            git push
          fi
